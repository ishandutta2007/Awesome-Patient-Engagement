<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="pulse-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 54px; fill: url(#text-gradient); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6)); }
      100% { transform: scale(1); opacity: 0.8; }
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }

    .animated-pulse { transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .animated-float { animation: float 6s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 10, 10; animation: dash 5s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="16" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.15">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Animated Glowing Background Nodes -->
  <circle cx="150" cy="200" r="180" fill="#0284c7" opacity="0.12" filter="blur(40px)" class="animated-float" />
  <circle cx="1050" cy="180" r="200" fill="#7c3aed" opacity="0.12" filter="blur(40px)" class="animated-float" style="animation-delay: -3s;" />

  <!-- Dynamic Heartbeat / Electrocardiogram Wave -->
  <path d="M 50,230 Q 200,230 300,230 L 320,230 L 330,170 L 345,280 L 360,130 L 375,250 L 385,220 L 400,230 Q 700,230 1150,230" fill="none" stroke="url(#pulse-gradient)" stroke-width="4" stroke-linecap="round" class="animated-line" />

  <!-- Main Content Shield / Container -->
  <g transform="translate(100, 70)" class="animated-float">
    <!-- Healthcare Cross Icon -->
    <g transform="translate(0, 30)">
      <rect x="0" y="25" width="70" height="20" rx="6" fill="#ef4444" filter="url(#glow)" />
      <rect x="25" y="0" width="20" height="70" rx="6" fill="#ef4444" filter="url(#glow)" />
    </g>

    <!-- Main Text Content -->
    <g transform="translate(110, 0)">
      <!-- Title -->
      <text x="0" y="52" class="title">Awesome Patient Engagement</text>
      <!-- Subtitle -->
      <text x="0" y="94" class="subtitle">Curated SaaS Platforms, EHR Integrations &amp; Open-Source Digital Health Ecosystem</text>

      <!-- Pill Badges -->
      <g transform="translate(0, 130)">
        <!-- Badge 1 -->
        <rect x="0" y="0" width="230" height="36" rx="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" class="animated-pulse" />
        <text x="115" y="23" text-anchor="middle" class="badge" fill="#93c5fd">🏥 Patient Portals</text>

        <!-- Badge 2 -->
        <rect x="245" y="0" width="220" height="36" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="1.5" class="animated-pulse" style="animation-delay: -1.5s;" />
        <text x="355" y="23" text-anchor="middle" class="badge" fill="#6ee7b7">⚡ FHIR &amp; Intake</text>

        <!-- Badge 3 -->
        <rect x="480" y="0" width="240" height="36" rx="18" fill="#581c87" stroke="#a855f7" stroke-width="1.5" class="animated-pulse" style="animation-delay: -3s;" />
        <text x="600" y="23" text-anchor="middle" class="badge" fill="#e9d5ff">💬 Secure Messaging</text>
      </g>
    </g>
  </g>
</svg>
